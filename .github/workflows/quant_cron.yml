name: Automatic Quant Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # Corre todos os dias às 8h UTC (9h em Portugal)
  workflow_dispatch:     # Permite-te correr o bot manualmente a qualquer momento

permissions:
  contents: write        # ⚠️ OBRIGATÓRIO: Permite ao bot guardar o Excel no repositório

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install xgboost scikit-learn openpyxl requests pandas

      - name: Executar o Motor Quantitativo
        run: |
          python motor_elite.py

      - name: Atualizar o Excel no Repositório
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add quant_apostas_elite_novo.xlsx
          git commit -m "Auto-update: novo excel de apostas" || exit 0
          git push
