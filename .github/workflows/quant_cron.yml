name: Automatic Quant Pipeline

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Crucial para permitir o git push autenticado

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl xgboost scikit-learn

      - name: Executar o Motor Quantitativo
        run: |
          python motor_elite.py

      - name: Atualizar o Excel e Base de Dados no Repositório
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          
          # Adiciona tanto o Excel como a Base de Dados para manter a banca persistente entre dias
          git add quant_apostas_elite_novo.xlsx quant_engine_elite.db
          
          # Faz commit apenas se houver alterações
          git diff --staged --quiet || git commit -m "Auto-update: excel e base de dados quant"
          
          # Faz push de volta para o repositório
          git push
