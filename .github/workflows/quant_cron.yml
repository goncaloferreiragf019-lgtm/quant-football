Cola lá dentro este código de automação:

YAML
name: Automatic Quant Pipeline

on:
  schedule:
    # Corre todos os dias às 08:00 UTC (que corresponde a 09:00 em Portugal Continental)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Motor Quantitativo
        run: |
          python motor_elite.py
